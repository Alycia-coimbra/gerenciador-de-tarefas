<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - ProManage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="perfil.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand navbar-dark bg-primary shadow-sm fixed-top">
        <div class="container-fluid px-3 px-md-4">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-tasks me-2"></i>ProManage
            </a>
            <div class="ms-auto d-flex align-items-center">
                <div class="dropdown">
                    <a class="text-white text-decoration-none dropdown-toggle d-flex align-items-center"
                       href="#" role="button" data-bs-toggle="dropdown">
                        <i class="fas fa-user-circle fa-lg me-2"></i>
                        <span class="d-none d-md-inline" id="navUserName">Usuário</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item active" href="perfil.html">Perfil</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#" onclick="logout()">Sair</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo -->
    <div class="container" style="padding-top: 80px; max-width: 700px;">

        <div class="profile-header d-flex align-items-center gap-4">
            <div class="avatar-circle" id="avatarInitials">?</div>
            <div>
                <h3 class="fw-bold mb-1" id="profileName"></h3>
                <p class="mb-0 opacity-75" id="profileEmail"></p>
                <small class="opacity-50" id="profileSince"></small>
            </div>
        </div>

        <!-- Informações da conta -->
        <div class="card mb-4">
            <div class="card-body p-4">
                <h5 class="fw-semibold mb-4">
                    <i class="fas fa-user me-2 text-primary"></i>Informações da Conta
                </h5>
                <form id="profileForm">
                    <div class="mb-3">
                        <label class="form-label">Nome completo</label>
                        <input type="text" class="form-control" id="inputNome">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="inputEmail" disabled>
                        <div class="form-text">O e-mail não pode ser alterado.</div>
                    </div>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="fas fa-save me-2"></i>Salvar alterações
                    </button>
                </form>
                <div id="profileAlert"></div>
            </div>
        </div>

        <!-- Ações -->
        <div class="card mb-4">
            <div class="card-body p-4">
                <h5 class="fw-semibold mb-3">
                    <i class="fas fa-cog me-2 text-primary"></i>Ações
                </h5>
                <a href="index.html" class="btn btn-outline-primary me-2">
                    <i class="fas fa-arrow-left me-2"></i>Voltar ao painel de controle
                </a>
                <button class="btn btn-outline-danger" onclick="logout()">
                    <i class="fas fa-sign-out-alt me-2"></i>Sair da conta
                </button>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="perfil.js"></script>
</body>
</html>
