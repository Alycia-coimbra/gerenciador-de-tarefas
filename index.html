<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProManage - Gerenciamento de Projetos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navbar superior fixa -->
    <nav class="navbar navbar-expand navbar-dark bg-primary shadow-sm fixed-top">
        <div class="container-fluid px-3 px-md-4">

            <!-- Botão hamburguer — visível apenas em mobile (abaixo de lg) -->
            <button class="btn btn-link text-white d-lg-none me-2 p-0"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#sidebarMenu"
                    aria-controls="sidebarMenu">
                <i class="fas fa-bars fa-lg"></i>
            </button>

            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-tasks me-2"></i>ProManage
            </a>

            <div class="ms-auto d-flex align-items-center">
                <div class="dropdown">
                    <a class="text-white text-decoration-none dropdown-toggle d-flex align-items-center"
                       href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-user-circle fa-lg me-2"></i>
                        <span class="d-none d-md-inline" id="navUserName">Usuário</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="perfil.html">Perfil</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#" onclick="logout()">Sair</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sidebar fixa — desktop (lg+) -->
    <div class="d-none d-lg-block bg-black text-white sidebar position-fixed h-100"
         style="width: 240px; top: 56px; z-index: 1000;">
        <div class="position-sticky pt-4">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="#" onclick="loadSection('dashboard')" class="nav-link active" id="nav-dashboard">
                        <i class="fas fa-home me-3"></i> Painel de controle
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" onclick="loadSection('users')" class="nav-link" id="nav-users">
                        <i class="fas fa-users me-3"></i> Usuários
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" onclick="loadSection('projects')" class="nav-link" id="nav-projects">
                        <i class="fas fa-folder me-3"></i> Projetos
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" onclick="loadSection('tasks')" class="nav-link" id="nav-tasks">
                        <i class="fas fa-list-check me-3"></i> Tarefas
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Offcanvas — menu mobile (abaixo de lg) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel"
         style="width: 240px;">
        <div class="offcanvas-header border-bottom border-secondary">
            <h6 class="offcanvas-title text-white fw-bold" id="sidebarMenuLabel">
                <i class="fas fa-tasks me-2"></i>ProManage
            </h6>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
        </div>
        <div class="offcanvas-body p-0 pt-2">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="#" onclick="loadSection('dashboard'); closeOffcanvas();" class="nav-link">
                        <i class="fas fa-home me-3"></i> Painel de controle
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" onclick="loadSection('users'); closeOffcanvas();" class="nav-link">
                        <i class="fas fa-users me-3"></i> Usuários
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" onclick="loadSection('projects'); closeOffcanvas();" class="nav-link">
                        <i class="fas fa-folder me-3"></i> Projetos
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" onclick="loadSection('tasks'); closeOffcanvas();" class="nav-link">
                        <i class="fas fa-list-check me-3"></i> Tarefas
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Conteúdo principal -->
    <div class="container-fluid" style="padding-top: 76px;">
        <div class="row">
            <main class="col-12 col-lg-9 col-xl-10 offset-lg-3 offset-xl-2 px-3 px-md-4 py-4" id="content">
                <!-- Conteúdo carregado via JS -->
            </main>
        </div>
    </div>

    <!-- Modal Usuário -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="userModalTitle">Novo Usuário</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" class="form-control" id="userNome" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="userEmail" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="saveUser()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Projeto -->
    <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="projectModalTitle">Novo Projeto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="projectForm">
                        <input type="hidden" id="projectId">
                        <div class="mb-3">
                            <label class="form-label">Nome do Projeto</label>
                            <input type="text" class="form-control" id="projectNome" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descrição</label>
                            <textarea class="form-control" id="projectDescricao" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="saveProject()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Tarefa -->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="taskModalTitle">Nova Tarefa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="taskForm">
                        <input type="hidden" id="taskId">
                        <div class="mb-3">
                            <label class="form-label">Título</label>
                            <input type="text" class="form-control" id="taskTitulo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descrição</label>
                            <textarea class="form-control" id="taskDescricao" rows="3"></textarea>
                        </div>
                        <div class="row g-3">
                          <div class="col-md-6">
                                <label class="form-label">Projeto</label>
                                <select class="form-select" id="taskProjectId" required></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Responsável</label>
                                <select class="form-select" id="taskUserId" required></select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="saveTask()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
